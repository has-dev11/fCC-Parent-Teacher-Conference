<html>
  <head>
    <base href="" />
    <style class="fcc-hide-header">
      head *,
      title,
      meta,
      link,
      script {
        display: none !important;
      }
    </style>
    <script>
      window.__frameId = "fcc-project-preview-frame";
      function __fccAlertParent(variant, externalLink) {
        window.parent.postMessage(
          {
            type: "fcc:preview:alert",
            variant: variant,
            externalLink: externalLink,
          },
          "https://www.freecodecamp.org",
        );
      }
      window.onerror = function (msg) {
        const string = msg.toLowerCase();
        if (string.includes("script error")) {
          msg = "Build error, open your browser console to learn more.";
        }
        console.log(msg);
        return true;
      };
      document.addEventListener(
        "click",
        function (e) {
          let element = e.target;
          while (element && element.nodeName !== "A") {
            element = element.parentElement;
          }
          if (
            element &&
            element.nodeName === "A" &&
            new URL(element.href).hash === ""
          ) {
            e.preventDefault();
            __fccAlertParent("external-link", element.href);
          }
          if (element) {
            const href = element.getAttribute("href");
            if (!href || (href[0] !== "#" && !href.match(/^https?:\/\//))) {
              e.preventDefault();
            } else if (href.match(/^#.+/)) {
              e.preventDefault();
              const scrollId = href.substring(1);
              window.location.hash = scrollId;
            }
          }
        },
        false,
      );
      document.addEventListener(
        "submit",
        function (e) {
          const action = e.target.getAttribute("action");
          e.preventDefault();
          if (action && action.match(/https?:\/\//)) {
            __fccAlertParent("external-form", action);
          }
        },
        false,
      );
    </script>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Parent Teacher Conference Form</title>
    <link rel="stylesheet" href="styles.css" />
  </head>

  <body>
    <main class="container">
      <h1 class="title center">Parent Teacher Conference Form</h1>
      <p class="description center">
        Please fill out the form below to help schedule your parent-teacher
        conference.
      </p>

      <form>
        <fieldset>
          <legend>Student Information</legend>
          <label for="student-name">Full Name: </label>
          <input
            type="text"
            name="student-name"
            id="student-name"
            required=""
            placeholder="E.g., Jane Doe"
          />

          <label for="grade">Student Grade: </label>
          <input
            type="number"
            name="grade"
            id="grade"
            required=""
            placeholder="E.g., 4"
          />
        </fieldset>

        <fieldset>
          <legend>Parent/Guardian Information</legend>
          <label for="parent-name">Parent/Guardian Name: </label>
          <input
            type="text"
            name="parent-name"
            id="parent-name"
            required=""
            placeholder="E.g., Nancy Doe"
          />
        </fieldset>

        <fieldset>
          <legend>Preferred Contact Method</legend>
          <label class="contact-method" for="email">Email: </label>
          <input
            id="email"
            class="contact-method-radio-btn"
            type="radio"
            name="contact-method"
            value="email"
            checked=""
          />

          <label class="contact-method" for="phone">Phone: </label>
          <input
            id="phone"
            class="contact-method-radio-btn"
            type="radio"
            name="contact-method"
            value="phone"
          />
        </fieldset>

        <fieldset>
          <legend>Additional Notes</legend>
          <label for="notes"
            >Any specific concerns or topics you'd like to discuss?</label
          >
          <textarea id="notes" name="notes" rows="4" cols="50"></textarea>
        </fieldset>

        <button class="submit-btn" type="submit">Submit Form</button>
      </form>
    </main>
  </body>
</html>
